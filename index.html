<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bumper Block</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score-box">
      <div id="score">0</div>
      <div id="combo"></div>
    </div>
    <div id="boost-bar"><div id="boost-fill"></div></div>
    <button id="restart" type="button" aria-label="Restart">&#x21bb;</button>
  </div>

  <button id="boost" type="button" aria-label="Boost"><span>BOOST</span></button>

  <div id="gameover" hidden>
    <div class="panel">
      <h1>Boxed in!</h1>
      <p>Score</p>
      <div id="final-score">0</div>
      <button id="restart-big" type="button">Play again</button>
    </div>
  </div>

  <div id="toast"><span class="swatch"></span><span>New color!</span></div>

  <div id="debug-text" hidden></div>

  <div id="rotate">
    <div class="phone"></div>
    <p>Rotate your phone to play</p>
  </div>

  <script src="lib/planck.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>

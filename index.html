<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bumper Block</title>
  <link rel="stylesheet" href="style.css?v=d71f7df9">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score-box">
      <div id="score">0</div>
      <div id="combo"></div>
    </div>
    <div id="goal"><div id="goal-label"></div><div id="goal-items"></div></div>
    <div id="health">
      <div id="repair" title="Repair color: explode these to heal"><span class="cross"></span></div>
      <div id="health-bar"><div id="health-fill"></div></div>
    </div>
    <button id="mute" type="button" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
        <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="restart" type="button" aria-label="Retry level">&#x21bb;</button>
  </div>

  <button id="boost" type="button" aria-label="Boost"><span>BOOST</span></button>
  <button id="ability" type="button" aria-label="Use ability"><span id="ability-label">CHAMELEON</span></button>
  <button id="ability-cycle" type="button" aria-label="Swap ability">&#x21c4;</button>

  <div id="gameover" class="overlay" hidden>
    <div class="panel">
      <h1 id="go-title">Boxed in!</h1>
      <p id="go-level"></p>
      <div id="final-score">0</div>
      <table id="go-stats" class="summary"></table>
      <div class="buttons">
        <button id="restart-big" class="primary" type="button">Retry level</button>
        <button id="restart-first" class="secondary" type="button">Level 1</button>
      </div>
    </div>
  </div>

  <div id="levelup" class="overlay" hidden>
    <div class="panel wide">
      <div class="col">
        <h1 id="lu-title">Level clear!</h1>
        <div id="lu-stars"></div>
        <table id="lu-stats"></table>
        <table id="lu-summary" class="summary"></table>
      </div>
      <div class="col">
        <p id="lu-pick">Pick an upgrade for the rest of the run</p>
        <div id="lu-cards"></div>
        <p id="lu-picks"></p>
        <div class="buttons">
          <button id="next-level" class="primary" type="button">Next level</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"><span class="swatch"></span><span class="text"></span></div>

  <div id="debug-text" hidden></div>

  <div id="rotate">
    <div class="phone"></div>
    <p>Rotate your phone to play</p>
  </div>

  <script src="lib/planck.min.js?v=1db17d97"></script>
  <script type="importmap">
  {
    "imports": {
      "./config.js": "./config.js?v=409fa9ba",
      "./js/abilities.js": "./js/abilities.js?v=c25e1be8",
      "./js/ai.js": "./js/ai.js?v=493854ae",
      "./js/audio.js": "./js/audio.js?v=d4739a14",
      "./js/damage.js": "./js/damage.js?v=fe0bc0ea",
      "./js/effects.js": "./js/effects.js?v=01992020",
      "./js/hud.js": "./js/hud.js?v=9b43db6f",
      "./js/input.js": "./js/input.js?v=0644f353",
      "./js/levels.js": "./js/levels.js?v=f0e6090e",
      "./js/main.js": "./js/main.js?v=00601da5",
      "./js/match.js": "./js/match.js?v=df3e4b51",
      "./js/physics.js": "./js/physics.js?v=1b1059e2",
      "./js/pileup.js": "./js/pileup.js?v=db631067",
      "./js/player.js": "./js/player.js?v=689b09db",
      "./js/render.js": "./js/render.js?v=e869f02f",
      "./js/spawner.js": "./js/spawner.js?v=a555c7be",
      "./js/terrain.js": "./js/terrain.js?v=80d0e6ae",
      "./js/upgrades.js": "./js/upgrades.js?v=e26ab28d"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=00601da5"></script>
</body>
</html>
